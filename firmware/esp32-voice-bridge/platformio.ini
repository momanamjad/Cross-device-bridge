[platformio]
description = Standalone Bluetooth Hands-Free Voice Bridge for Device Bridge
default_envs = esp32s

[env:esp32s]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
upload_speed = 921600

build_flags = 
    -DCONFIG_SW_COEXIST_ENABLE=1
    -DCONFIG_BT_HFP_CLIENT_ENABLE=1
